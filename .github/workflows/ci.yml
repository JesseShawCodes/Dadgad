name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/django_backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: maddness
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maddness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: madness_backend.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      database_name: maddness
      database_user: postgres
      database_password: postgres
      database_host: 127.0.0.1
      database_port: "5432"
      UPSTASH_REDIS_URL: redis://localhost:6379/0
      apple_artist_details_url: https://api.music.apple.com/v1/catalog/us/
      apple_search_url: https://api.music.apple.com/v1/catalog/us/search?term=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/django_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: python -m pytest --cov=brackets --cov=apple_search --cov-report=term-missing

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dadgad

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dadgad/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --coverage=false
